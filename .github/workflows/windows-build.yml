name: Windows build and installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Run automated tests
        run: python -m unittest discover -s . -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Windows desktop application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name CyberSentinel cybersentinel_kev.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "CyberSentinel_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload portable application and installer
        uses: actions/upload-artifact@v4
        with:
          name: Summerlinc-CyberSentinel-Windows-${{ github.run_number }}
          path: |
            dist/CyberSentinel/
            installer_output/Summerlinc_CyberSentinel_Setup.exe
          if-no-files-found: error
          retention-days: 14
