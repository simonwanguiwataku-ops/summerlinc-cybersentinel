name: Windows build and test

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run automated tests
        shell: pwsh
        run: python -m unittest discover -s . -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build desktop application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name CyberSentinel cybersentinel_kev.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_output | Out-Null
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup' -Filter 'ISCC.exe' -Recurse | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
          & $iscc.FullName 'CyberSentinel_Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: CyberSentinel-Windows-Portable
          path: dist/CyberSentinel/
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CyberSentinel-Windows-Installer
          path: installer_output/*.exe
          if-no-files-found: error
